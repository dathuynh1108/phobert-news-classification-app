syntax = "proto3";

package vnn.classifier;

message ClassifyRequest {
  string request_id = 1;
  string title = 2;
  string content = 3;
  string source_url = 4;
  int32 top_k = 5;
}

message Candidate {
  string label = 1;
  double score = 2;
}

message ClassifyResponse {
  string request_id = 1;
  string model_version = 2;
  string label = 3;
  double confidence = 4;
  double margin = 5;
  repeated Candidate candidates = 6;
  repeated string rationale_keywords = 7;
  string auto_decision = 8;
  int32 latency_ms = 9;
}

service ClassifierService {
  rpc ClassifyArticle(ClassifyRequest) returns (ClassifyResponse);
}
